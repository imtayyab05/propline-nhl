name: Daily slate

# PropLine NHL. Dispatched by Netlify scheduled functions (netlify/functions/
# scheduled-slate*.mjs) and by the dashboard's Update Now button. Slot times live in
# those functions, not here.
#
# Budgets this workflow shares with PropLine MLB (same accounts):
#   - GitHub Actions minutes: 2,000/month across ALL private repos. A run here is
#     ~2 minutes, so five a day is roughly 300-450 minutes a month.
#   - Groq: same key and daily token cap as MLB. Written reasons are only generated on
#     the slots listed in EXPLAIN below, never on every run.

on:
  # NO `schedule:` here on purpose. Netlify drives the runs; running both schedulers
  # double-fired every slot on MLB and exhausted the free minutes by the 18th.
  workflow_dispatch:
    inputs:
      slate_date:
        description: 'Slate date (YYYY-MM-DD). Blank = today (US Eastern).'
        required: false
        type: string
      run_kind:
        description: 'Which slot dispatched this. Netlify sets it; leave blank by hand.'
        required: false
        default: ''
        type: string

concurrency:
  group: propline-nhl-slate
  # Two overlapping dispatches produce the same board — cancel rather than pay twice.
  cancel-in-progress: true

jobs:
  slate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      # Wired in deliberately: on MLB this key existed as a secret but was missing from
      # this block, and every scheduled run silently published empty market columns.
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Work out the slate and the run type
        id: cfg
        # Inputs arrive as env vars, never spliced into the script with ${{ }}, so a
        # crafted value cannot escape the quotes.
        env:
          IN_DATE: ${{ inputs.slate_date }}
          IN_KIND: ${{ inputs.run_kind }}
        run: |
          # The slate is the US Eastern date. A late slot fires after midnight UTC
          # while West Coast games are still being played, and must still mean
          # "tonight", not tomorrow.
          DATE="$IN_DATE"
          if [ -z "$DATE" ]; then DATE=$(TZ=America/New_York date +%F); fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

          # Fixed list, so an arbitrary string never becomes a run label.
          case "$IN_KIND" in
            scheduled_morning|scheduled_midday|scheduled_pregame|scheduled_late)
              KIND="$IN_KIND" ;;
            *) KIND=manual ;;
          esac
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"

          # Written reasons only on these slots (shared Groq quota). The morning run
          # gives the day's first read; the pre-game run re-explains once goalies and
          # game rosters have firmed up. Manual runs skip it.
          EXPLAIN="scheduled_morning scheduled_pregame"
          case " $EXPLAIN " in
            *" $KIND "*) echo "rationale=" >> "$GITHUB_OUTPUT" ;;
            *)           echo "rationale=--no-rationale" >> "$GITHUB_OUTPUT" ;;
          esac

          # Market lines cost credits (free tier, 500/month): game lines on the morning
          # run, game lines + team totals before games, nothing on the others — those
          # reuse the stored lines. Budget in propline/odds.py.
          case "$KIND" in
            scheduled_morning) echo "odds=game" >> "$GITHUB_OUTPUT" ;;
            scheduled_pregame) echo "odds=full" >> "$GITHUB_OUTPUT" ;;
            *)                 echo "odds=none" >> "$GITHUB_OUTPUT" ;;
          esac

          # Last season's logs never change; cache them by season so only the first
          # run of the season pulls them (~30 requests).
          M=$(date -d "$DATE" +%-m); Y=$(date -d "$DATE" +%Y)
          if [ "$M" -ge 7 ]; then S=$((Y - 1)); else S=$((Y - 2)); fi
          echo "prev=${S}$((S + 1))" >> "$GITHUB_OUTPUT"
          echo "cur=$((S + 1))$((S + 2))" >> "$GITHUB_OUTPUT"
          echo "older1=$((S - 1))${S}" >> "$GITHUB_OUTPUT"
          echo "older2=$((S - 2))$((S - 1))" >> "$GITHUB_OUTPUT"
          echo "Slate $DATE — $KIND"

      - name: Restore last season's logs
        uses: actions/cache@v4
        with:
          path: data/cache/${{ steps.cfg.outputs.prev }}
          key: nhl-prev-logs-${{ steps.cfg.outputs.prev }}

      # Two older seasons' scoring lines, for head-to-head. Finished seasons never
      # change, so one cache entry per pair lasts the whole season.
      - name: Restore head-to-head history
        uses: actions/cache@v4
        with:
          path: |
            data/cache/${{ steps.cfg.outputs.older1 }}
            data/cache/${{ steps.cfg.outputs.older2 }}
          key: nhl-history-${{ steps.cfg.outputs.older1 }}-${{ steps.cfg.outputs.older2 }}

      # This season's shot locations (input to the xG model) grow by a few games a day.
      # A cache key is write-once, so each run saves under its own key and restores the
      # newest one: a run then fetches only the games finished since the last run.
      - name: Restore this season's shot data
        uses: actions/cache@v4
        with:
          path: data/cache/${{ steps.cfg.outputs.cur }}
          key: nhl-shots-${{ steps.cfg.outputs.cur }}-${{ github.run_id }}
          restore-keys: nhl-shots-${{ steps.cfg.outputs.cur }}-

      - name: Collect
        env:
          DATE: ${{ steps.cfg.outputs.date }}
          KIND: ${{ steps.cfg.outputs.kind }}
        run: python scripts/collect.py --date "$DATE" --run-kind "$KIND"

      - name: Process and publish
        env:
          DATE: ${{ steps.cfg.outputs.date }}
          KIND: ${{ steps.cfg.outputs.kind }}
          RATIONALE: ${{ steps.cfg.outputs.rationale }}
          ODDS: ${{ steps.cfg.outputs.odds }}
        run: python scripts/process.py --date "$DATE" --run-kind "$KIND" --publish --odds "$ODDS" $RATIONALE
